<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2 - Auditoría de Accesibilidad</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #ffffff;
      color: #333333;
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
    }

    /* ERROR DE CONTRASTE INTENCIONADO: Texto gris claro sobre fondo blanco */
    .texto-secundario {
      color: #b0b0b0; /* Ratio 1.9:1 -> INCORRECTO (requiere >= 4.5:1) */
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    input[type="email"] {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* ERROR DE FOCO INTENCIONADO: Se elimina el indicador de foco */
    button {
      background-color: #0284c7;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:focus {
      outline: none; /* Invalida la navegación por teclado */
    }
  </style>
</head>
<body>

  <header>
    <h1>Formulario de Registro en la Plataforma</h1>
  </header>

  <main>
    <!-- ERROR DE JERARQUÍA DE HEADINGS: Pasa de h1 a h4 saltándose h2 y h3 -->
    <h4>Datos Personales</h4>

    <!-- ERROR DE CONTRASTE: Texto inaccesible -->
    <p class="texto-secundario">Por favor, rellena los campos para continuar con el proceso.</p>

    <!-- ERROR DE ALT EN IMAGEN: Imagen decorativa/informativa sin atributo alt -->
    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230284c7'/><text x='50%' y='55%' font-size='40' text-anchor='middle' fill='white'>👤</text></svg>" width="80" height="80">

    <form>
      <div class="form-group">
        <!-- ERROR DE LABEL EN FORMULARIO: El input no tiene ningún <label> ni id asociado -->
        <input type="email" placeholder="Escribe tu correo electrónico...">
      </div>

      <!-- ERROR DE FOCO: Imposible saber si tiene el foco al pulsar Tab -->
      <button type="submit">Registrarse</button>
    </form>
  </main>

</body>
</html>

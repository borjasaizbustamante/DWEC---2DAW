<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej10</title>
</head>
<body>
    <h1>Ejercicio 10</h1>

    <input type="button" value="Nueva ventana" onClick="nuevaVentana()"/>
    <input type="button" value="Cerrar ventana" onClick="cerrarVentana()"/>
    <input type="button" value="Mover 10px" onClick="nueva.moveBy(10,10); nueva.focus()"/>
    <input type="button" value="Mover a 100,100" onClick="nueva.moveTo(100,100); nueva.focus()"/>
    <input type="button" value="Aumentar 10px" onClick="nueva.resizeBy(10,10); nueva.focus()"/>
    <input type="button" value="Aumentar a 400x200" onClick="nueva.resizeTo(400,200); nueva.focus()"/>
    <input type="button" value="Scroll arriba" onClick="{nueva.scrollTo(0,0); nueva.focus()}"/>
    <input type="button" value="Scroll a 10px" onClick="nueva.scrollTo(0,10); nueva.focus()"/>
    <script type="text/javascript" src="functions.js"></script>
</body>
</html>

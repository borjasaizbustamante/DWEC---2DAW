<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ej. Funciones 4</title>
<script type="text/javascript" src="scripts/funciones.js"></script>
<script>
//4.Calculo areas

var mensaje="";
var num1,num2,opc;

do{
 opc= parseInt(prompt("Que area quieres calcular:\n1.-Cuadrado \n2.-Circulo \n3.-Triangulo \n4.-Salir \n\nOpcion(1..4):"));

 switch (opc){
   case 1: num1 = parseInt(prompt("Introduce el lado del cuadrado: "));
           mensaje="El Area del cuadrado es: "+areacuadrado(num1); break;
		   
   case 2: num1 = parseInt(prompt("Introduce el radio del circulo: "));
           mensaje="El Area del circulo  es: "+areacirculo(num1); break;
		   
   case 3: num1 = parseInt(prompt("Introduce la base del triangulo: "));
           num2 = parseInt(prompt("Introduce la altura del triangulo: "));
           mensaje="El Area del triangulo es: "+areatriangulo(num1,num2); break;
		   
   case 4: mensaje="Hasta Otra Amigo"; break;
   default: mensaje="OPCION INCORRECTA";
 }
  alert (mensaje);
  
}while (opc!=4);
</script>
</head>

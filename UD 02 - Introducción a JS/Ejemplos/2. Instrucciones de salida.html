<!DOCTYPE html>
<html>
    <head>
            <meta charset="UTF-8">  
            <!-- Instrucción decodificación UTF-8 por si hay algun caracter especial para que se muestre correctamente -->

    </head>


    <body>
        <h1>Bienvenido a las instrucciones de salida</h1> 
        <p id="miParrafo">Párrafo de prueba</p>
        <script>
           window.alert("Hola");
           window.alert(5+4);
           document.write("<h2>Que tal?</h2>");
           document.getElementById("miParrafo").innerHTML = "Parrafo cambiado";
           console.log("Texto para la consola");
        </script>

    </body>

</html>

<!-- Instrucciones de Salida  -->
<!-- 1.window.alert (la instruccion alert forma parte de un objeto de javascript que se llama window) -->
<!-- 2.document.write (se usa para testear, acepta etiquetas html, sólo para hacer pruebas.) -->
<!-- 3.document.getElementById (mejor que document.write, hace referencia a un documento html cuyo Id sea el mismo que pongamos entre parentesis)  ) -->
<!-- 	El metodo innerHTML nos deja sobreescribir dentro de las etiquetas a las que hagamos referencia. -->
<!-- 4.console.log (solo se ve en la consol del navegador) -->

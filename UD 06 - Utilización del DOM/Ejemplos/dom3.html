<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Document Object Model</title>
</head>

<body>
    <div id="norte">
        <h2>Galicia</h2><!--Esto es un comentario-->
        <ul id="lista">
            <li>A Coruña</li>
            <li>Lugo</li>
            <li>Ourense</li>
            <li>Pontevedra</li>
        </ul>
    </div>
    <div id="sur">
        <h2>Canarias</h2>
        <ul id="lista">
            <li>Santa Cruz de Tenerife</li>
            <li>Las Palmas</li>
        </ul>
    </div>
    <div id="texto"></div>

    <script>
        window.addEventListener("DOMContentLoaded", iniciar);

        function iniciar() {
            for (var i=0; i < document.getElementsByTagName("h2").length; i++) {
                document.getElementsByTagName("h2")[i].addEventListener("click", recorrerAdelante);
            }

        function recorrerAdelante(e) {
            var texto = "";
            var h2 = e.target;
            texto += "Has elegido " + h2.textContent;

            //Seleccionamos el elemento padre
            var padre = h2.parentElement;
            texto += " que está situada en el " + padre.id + "<br/>";

            //Seleccionamos el hermano
            //var ul = h2.nextSibling; No lo usamos porque incluye nodos de más tipos 
            var ul = h2.nextElementSibling; //Solo nodos de tipo elemento 

            //Mostrar número de hijos
            //OJO!! .childNodes incluye texto y comentarios.
            texto += "El número de provincias es " + ul.children.length + ": ";

            var hijo = ul.firstChild;

            while (hijo != null) {
                texto += " " + hijo.textContent;
                hijo = hijo.nextElementSibling;
            }

            //Mostrar el texto
            document.getElementById("texto").innerHTML = texto;
            //Si ponemos .textContent mostramos texto plano y no coge etiquetas HTML

        }
        }
    </script>
</body>

</html>

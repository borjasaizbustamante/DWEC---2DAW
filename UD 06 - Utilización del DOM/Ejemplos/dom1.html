<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        .miClase {
            color: red;
        }
    </style>
</head>
<body>
    <div id="main">
        <p id="parrafo1">Este es el primer párrafo</p>
        <p id="parrafo2">Este es el segundo <strong>párrafo</strong></p>
        <p id="parrafo3" class="miClase">Este es el tercer párrafo</p>
    </div>
    <br/>
    <button id="cambiarTextos">Cambiar texto de párrafos</button>
    <button id="cambiarClases">Cambiar clases de párrafos</button>
    <button id="quitarClases">Quitar clases de todos los párrafos</button>

    <script>
        window.onload = iniciar;
        function iniciar()  {
            document.querySelector("button#cambiarTextos").addEventListener("click", cambiarTextos);
            document.querySelector("button#cambiarClases").addEventListener("click", cambiarClases);
            document.querySelector("button#quitarClases").addEventListener("click", quitarClases);
        }

        function cambiarTextos() {
            //Seleccionar UN UNICO elemento según su id
            document.getElementById("parrafo1").innerHTML = "Primer parrafo cambiado";
            //Seleccionar TODOS los elementos según etiqueta
            document.getElementsByTagName("p")[1].innerHTML = "Segundo parrafo cambiado";
            //Seleccionar TODOS los elementos según su clase
            document.getElementsByClassName("miClase")[0].innerHTML = "Tercer parrafo cambiado";

            //Seleccionar elementos dentro de otros elementos
            var principal = document.getElementById("parrafo2");
            var parrafo2 = principal.querySelector("strong");
        }     
        
        function cambiarClases() {
            document.getElementById("parrafo1").setAttribute("class", "miClase");
            document.getElementById("parrafo2").className = "miClase";
        }

        function quitarClases() {
            for (var i = 0; i<document.getElementsByTagName("p").length; i++) {
                document.getElementsByTagName("p")[i].className = "";
            }
        }
    </script>

</body>
</body>
</html>
